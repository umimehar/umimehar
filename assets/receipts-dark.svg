<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-label="7,038 contributions in the past 12 months, 99% in private client repos">
  <rect x="0.5" y="0.5" width="839" height="167" rx="12" fill="#161B22" stroke="#30363D"/>
  <text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8B949E">RECEIPTS · PAST 12 MONTHS</text>
  <text x="32" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#E6EDF3">7,038</text>
  <text x="32" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">contributions</text>
  <text x="272" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#3FB950">99%</text>
  <text x="272" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">in private client repos</text>
